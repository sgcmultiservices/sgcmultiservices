<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse all SGC printing, disposable and multiservice offerings.">
<title>All Services | SGC</title>
<style>
:root{--navy:#082c70;--blue:#075bd8;--yellow:#ffca05;--green:#118342;--purple:#6522b8;--ink:#15233c;--muted:#5c6880;--bg:#f5f8ff;--white:#fff;--line:#e1e8f4}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}a{text-decoration:none;color:inherit}.wrap{width:min(1080px,92%);margin:auto}.header{background:#fff;box-shadow:0 3px 20px #0b2a6010}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:18px}.logo{display:flex;align-items:center;font-weight:950;color:var(--navy);font-size:1.7rem;letter-spacing:1px}.logo img{display:block;width:220px;max-height:64px;height:auto;object-fit:contain}.btn{display:inline-flex;padding:11px 16px;border-radius:10px;background:var(--blue);color:#fff;font-weight:800}.hero{background:linear-gradient(120deg,#082c70,#075bd8);color:#fff;padding:36px 0}.hero h1{margin:0 0 8px;font-size:clamp(2rem,4vw,3rem)}.hero p{margin:0;color:#e5edff}.content{padding:30px 0 60px}.tools{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}.tools input,.tools select{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.tools input{flex:1;min-width:220px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.group{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.group h2{color:#fff;margin:0;padding:17px 20px;font-size:1.25rem}.printing h2{background:linear-gradient(120deg,#064bb8,#1683f4)}.disposable h2{background:linear-gradient(120deg,#08763b,#1ca95b)}.multi h2{background:linear-gradient(120deg,#5116a2,#8848e5)}.items{padding:12px 20px}.item{padding:12px 0;border-bottom:1px solid #eef1f7;display:flex;justify-content:space-between;gap:12px;align-items:center}.item:last-child{border-bottom:0}.item button{border:1px solid #c9d8f5;color:var(--blue);background:#fff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer;white-space:nowrap}.hidden{display:none!important}.empty{background:#fff;padding:20px;border:1px solid var(--line);border-radius:12px;text-align:center;color:var(--muted)}@media(max-width:680px){.list{grid-template-columns:1fr}.nav{padding:12px 0}.logo img{width:min(210px,60vw)}.hero{padding:28px 0}}
</style>
</head>
<body>
<header class="header"><div class="wrap nav"><a class="logo" href="index.html" aria-label="SGC home"><img src="assets/sgc-logo.svg" alt="SGC"></a><a class="btn" href="index.html">← Back to Home</a></div></header>
<section class="hero"><div class="wrap"><h1 id="pageTitle">All Products & Services</h1><p>Browse the full list of SGC offerings. Contact us on WhatsApp for rates and availability.</p></div></section>
<main class="wrap content"><div class="tools"><input id="search" type="search" placeholder="Search this list…" aria-label="Search services"><select id="filter" aria-label="Choose a category"><option value="all">All categories</option><option value="printing">Printing</option><option value="disposable">Disposable Items</option><option value="multi">Multiservice</option></select></div><div class="list">
<section class="group printing" data-group="printing"><h2>🖨️ Printing</h2><div class="items" id="printingItems"></div></section>
<section class="group disposable" data-group="disposable"><h2>🥤 Disposable Items</h2><div class="items" id="disposableItems"></div></section>
<section class="group multi" data-group="multi"><h2>🤝 Multiservice</h2><div class="items" id="multiItems"></div></section>
</div><p id="empty" class="empty hidden">No matching services found. Try another search.</p></main>
<script>
const products={
printing:["Jumbo Xerox","Color/BW Print","Book Binding","Project Book","Spiral Binding","ID Cards","Scanning","Lamination","Flex Designing & Print"],
disposable:["Tea Cups","Plastic Water glass","300ml Plastic Water glass","Paper glass Printed","Bagasse","Spoon","Paper Plates","Prasad wati","Nashta dish Silver (P)","Meal Tray","Silver Foil Container with Lid","Plastic Container with lid","Alluminium Silver Foil roll","Silver Parcel Pouch","Polymer Big Bag","Plastic & Paper Sipper Glass with Lid","Cling Wrap","Tissue Papers","Plastic Beer Glass","Chatni Wati/Bowl","Chutney Thaili/Bag","Plastic Carry Bags"],
multi:["Contracts — Classification by Legal Enforceability (Indian Contract Act, 1872)","Valid Agreement","Void Agreement","Voidable Agreement","Illegal Agreement","Rent Agreement","Sale Agreement","Mortgage Agreement","Other Agreements","Classification by Formation and Obligation","Bilateral Agreement","Unilateral Agreement","Express Agreement","Implied Agreement","Executed Agreement","Executory Agreement","Common Business and Commercial Agreements","Non-Disclosure Agreement (NDA)","Employment Agreement","Independent Contractor Agreement","Master Service Agreement (MSA)","Statement of Work (SOW)","Partnership Agreement","Shareholder Agreement","Lease Agreement","Rent Agreement","Memorandum of Understanding (MOU)","Letter of Intent (LOI)","Sales Contract / Bill of Sale","Licensing Agreement","Joint Venture (JV) Agreement","Real Estate Contracts","Purchase and Sale Agreement (PSA)","Commercial Lease Agreement","Residential Lease Agreement","Sublease Agreement","Property Management Agreement","Rent-to-Own / Lease Option Agreement","Employment Contracts","Permanent / Standard Employment Contract","Fixed-Term / Temporary Employment Contract","Independent Contractor Agreement (1099 Agreement)","Non-Compete Agreement","Letter of Intent (LOI) / Offer Letter","Online Applications","Registration","Licences","Loan Consultancy","Legal Consultancy","Business Consultancy","Career Courses Consultancy"]};
const wa='https://wa.me/917378734555?text=';
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const params=new URLSearchParams(location.search);const initial=params.get('category');if(['printing','disposable','multi'].includes(initial)){document.getElementById('filter').value=initial;document.getElementById('pageTitle').textContent=({printing:'All Printing Services',disposable:'All Disposable Items',multi:'All Multiservices'})[initial];}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const f=document.getElementById('filter').value;let count=0;Object.entries(products).forEach(([key,names])=>{const section=document.querySelector('[data-group="'+key+'"]');const holder=document.getElementById(key+'Items');holder.innerHTML='';let shown=0;names.forEach(name=>{if(q&&!name.toLowerCase().includes(q))return;shown++;count++;const item=document.createElement('div');item.className='item';item.innerHTML='<span>'+esc(name)+'</span><button type="button">Ask on WhatsApp</button>';item.querySelector('button').addEventListener('click',()=>window.open(wa+encodeURIComponent('Hello SGC, please share details and pricing for: '+name),'_blank','noopener'));holder.appendChild(item);});section.classList.toggle('hidden',f!=='all'&&f!==key||shown===0);});document.getElementById('empty').classList.toggle('hidden',count>0);}
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);render();
</script>
</body></html>
